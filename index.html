<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Trust Technology</title>
    <link rel="stylesheet" href="DesignSystem.css">
    <link rel="stylesheet" href="index.css">
    <script>
        // Proteção contra inspeção simples
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false; // F12
            if (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0))) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // View Source
        };

        // Anti-Debugger Loop
        (function() {
            const block = function() {
                setInterval(function() {
                    (function() {
                        return false;
                    }
                    ["constructor"]("debugger")
                    ["call"]());
                }, 50);
            };
            try {
                block();
            } catch (err) {}
        })();

        // Aviso no console
        console.log("%cSafeTrust Security System", "color: #0ea5e9; font-size: 30px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);");
        console.log("%cEste sistema está protegido. Qualquer tentativa de engenharia reversa ou acesso não autorizado ao código é monitorada.", "color: #94a3b8; font-size: 14px;");

        // Bloquear CTRL+S
        window.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.keyCode == 83) { // CTRL+S
                e.preventDefault();
                return false;
            }
        });
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>

</html>
